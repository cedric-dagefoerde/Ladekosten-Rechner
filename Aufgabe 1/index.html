<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Ladekosten-Rechner</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js" defer></script>
</head>

<body>
    <form class="formular">
        <h1>Ladekosten-Rechner</h1>
        <div class="form-group">
            <label for="name"> Akkukapazität (kWh)
                <input type="number" id="Akkukapazitaet" name="Akkukapazität in kWh" required />
            </label>
        </div>
        <div class="form-group">
            <label for="name"> Ladestand von (%)
                <input type="number" id="LadestandVon" name="Ladestand von (%)" required />
            </label>
        </div>
        <div class="form-group">
            <label for="name"> Ladestand bis (%)
                <input type="number" id="LadestandBis" name="Ladestand bis (%)" required />
            </label>
        </div>
        <div class="form-group">
            <label for="name"> Strompreis (€ pro kWh)
                <input type="number" id="Strompreis" name="Strompreis (€ pro kWh)" required />
            </label>
        </div>
        <div class="form-group">
            <label for="name"> Ladeleistung (kW)
                <input type="number" id="Ladeleistung" name="Ladeleistung (kW)" required />
            </label>
        </div>
        <div class="button">
            <button type="button" id="ausrechnen" >Ausrechnen</button>
        </div>
        <div id="ergebnis">
            <p><strong>geladene kWh:</strong> <span id="ausgabe-kWh">0.00</span> kWh</p>
            <p><strong>Ladekosten:</strong> <span id="ausgabe-kosten">0.00</span> €</p>
            <p><strong>Ladedauer:</strong> <span id="ausgabe-dauer">0 Std. 0Min.</span></p>
        </div>
    </form>

</body>

</html>
