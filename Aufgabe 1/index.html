<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <title>Ladekosten-Rechner</title>
    </head>
<body>
    <h1>Ladekosten-Rechner</h1>
    <label for="name"> Akkugröße (kWh)
        <input type="number" id="1" name="Akkugröße in kWh" required/>
    </label> 
    <br>
    <label for="name">  Ladestand von/bis (%)
        <input type="number" id="2" name="Ladestand von/bis (%)" required/>
    </label>
    <br>
    <label for="name">  Strompreis (€ pro kWh)
        <input type="number" id="3" name="Strompreis (€ pro kWh)" required/>
    </label> 
    <br>
    <label for="name">  Ladeleistung (kW)
        <input type="number" id="4" name="Ladeleistung (kW)" required/>
    </label>

</body>
</html>
